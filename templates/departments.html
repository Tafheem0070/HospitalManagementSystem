<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments - MediCare</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

{% include 'sidebar.html' %}

<div class="main-content">

    <div class="top-bar">
        <h1>Departments</h1>
    </div>

    <div class="form-box">

        <h2>Add Department</h2>

        <form method="POST" action="/add_department">

            <input type="text"
                   name="name"
                   placeholder="Department Name"
                   required>

            <button type="submit">Add Department</button>

        </form>

    </div>

    <div class="table-box">

        <h2>Department List</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Department Name</th>
                </tr>
            </thead>

            <tbody>

                {% for department in departments %}

                <tr>
                    <td>{{ department[0] }}</td>
                    <td>{{ department[1] }}</td>
                </tr>

                {% else %}

                <tr>
                    <td colspan="2">No departments added yet.</td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
