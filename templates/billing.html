<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Billing - MediCare</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

{% include 'sidebar.html' %}

<div class="main-content">

    <div class="top-bar">
        <h1>Billing</h1>
    </div>

    <div class="form-box">

        <h2>Create Bill</h2>

        <form method="POST" action="/add_bill">

            <input type="number"
                   name="patient_id"
                   placeholder="Patient ID"
                   required>

            <input type="number"
                   step="0.01"
                   name="amount"
                   placeholder="Amount"
                   required>

            <select name="payment_status" required>
                <option value="">Select Payment Status</option>
                <option value="Paid">Paid</option>
                <option value="Pending">Pending</option>
            </select>

            <input type="date"
                   name="bill_date"
                   required>

            <button type="submit">Create Bill</button>

        </form>

    </div>

    <div class="table-box">

        <h2>Bill List</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Patient ID</th>
                    <th>Amount</th>
                    <th>Payment Status</th>
                    <th>Bill Date</th>
                </tr>
            </thead>

            <tbody>

                {% for bill in bills %}

                <tr>
                    <td>{{ bill[0] }}</td>
                    <td>{{ bill[1] }}</td>
                    <td>{{ bill[2] }}</td>
                    <td>{{ bill[3] }}</td>
                    <td>{{ bill[4] }}</td>
                </tr>

                {% else %}

                <tr>
                    <td colspan="5">No bills created yet.</td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
